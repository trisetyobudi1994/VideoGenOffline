name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download VAE Model
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -f -o app/src/main/assets/models/causal_video_vae_decoder.tflite \
            "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/causal_video_vae_decoder.tflite" \
            || echo "WARN: VAE download skipped"
          ls -la app/src/main/assets/models/ || true

      - name: Download Text Encoder
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -f -o app/src/main/assets/models/dt5_text_encoder.tflite \
            "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/dt5_text_encoder.tflite" \
            || echo "WARN: Text encoder download skipped"
          ls -la app/src/main/assets/models/ || true

      - name: Download & Convert Tokenizer (HARUS BERHASIL)
        run: |
          set -e
          mkdir -p app/src/main/assets/models

          # Coba beberapa nama file yang umum di repo HuggingFace
          FOUND=""
          for NAME in t5_spiece.model spiece.model tokenizer.model; do
            echo "Mencoba ${NAME}..."
            if curl -L -f -o app/src/main/assets/models/spiece.model \
              "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/${NAME}"; then
              if [ -s app/src/main/assets/models/spiece.model ]; then
                echo "OK: ${NAME} berhasil diunduh"
                FOUND="${NAME}"
                break
              fi
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: Tidak ada file spiece.model yang bisa diunduh dari repo Neo_Dragon"
            echo "URL yang dicoba:"
            echo "  - t5_spiece.model"
            echo "  - spiece.model"
            echo "  - tokenizer.model"
            exit 1
          fi

          ls -la app/src/main/assets/models/spiece.model

          pip install sentencepiece

          python - <<'PY'
          import sentencepiece as spm
          import json
          import os
          import sys

          src = "app/src/main/assets/models/spiece.model"
          dst = "app/src/main/assets/models/tokenizer.json"

          if not os.path.exists(src):
              print(f"ERROR: {src} tidak ditemukan")
              sys.exit(1)

          sp = spm.SentencePieceProcessor()
          sp.load(src)

          vocab = []
          for i in range(sp.get_piece_size()):
              piece = sp.id_to_piece(i)
              score = float(sp.get_score(i))
              vocab.append([piece, score])

          data = {
              "version": "1.0",
              "truncation": None,
              "padding": None,
              "added_tokens": [],
              "normalizer": None,
              "pre_tokenizer": None,
              "post_processor": None,
              "decoder": None,
              "model": {
                  "type": "Unigram",
                  "unk_id": 2,
                  "vocab": vocab
              }
          }

          with open(dst, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)

          size = os.path.getsize(dst)
          print(f"OK: tokenizer.json dibuat dengan {len(vocab)} token, ukuran {size} bytes")

          if len(vocab) < 1000:
              print("ERROR: vocab terlalu kecil, curiga file spiece.model rusak")
              sys.exit(1)
          if size < 100000:
              print("ERROR: tokenizer.json terlalu kecil, curiga konversi gagal")
              sys.exit(1)
          PY

          ls -la app/src/main/assets/models/tokenizer.json

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Verifikasi Assets Sebelum Build
        run: |
          echo "=== Isi app/src/main/assets/models/ ==="
          ls -la app/src/main/assets/models/ || true
          echo ""
          echo "=== Cek tokenizer.json wajib ada ==="
          test -s app/src/main/assets/models/tokenizer.json || (echo "FATAL: tokenizer.json tidak ada!" && exit 1)
          echo "OK: tokenizer.json ada dan tidak kosong"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
