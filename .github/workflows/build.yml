name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download VAE model (optional)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -f -o app/src/main/assets/models/causal_video_vae_decoder.tflite \
            "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/causal_video_vae_decoder.tflite" \
            || echo "Model download skipped"

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
