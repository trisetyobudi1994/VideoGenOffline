name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download VAE Model
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -f -o app/src/main/assets/models/causal_video_vae_decoder.tflite \
            "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/causal_video_vae_decoder.tflite" \
            || echo "VAE download skipped"

      - name: Download and Convert Text Encoder & Tokenizer
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          # Download model dt5
          curl -L -f -o app/src/main/assets/models/dt5_text_encoder.tflite \
            "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/dt5_text_encoder.tflite" \
            || echo "Text encoder download skipped"
          
          # Download file spiece.model
          curl -L -f -o app/src/main/assets/models/t5_spiece.model \
            "https://huggingface.co/litert-community/Neo_Dragon/resolve/main/t5_spiece.model" \
            || echo "Spiece model download skipped"

          # Konversi ke tokenizer.json menggunakan Python
          pip install tokenizers sentencepiece
          python -c "
          from tokenizers import SentencePieceUnigramTokenizer
          tokenizer = SentencePieceUnigramTokenizer.from_file('app/src/main/assets/models/t5_spiece.model')
          tokenizer.save('app/src/main/assets/models/tokenizer.json')
          "

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
